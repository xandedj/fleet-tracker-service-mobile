<ion-toolbar>
    <ion-buttons slot="secondary">
      <ion-button (click)="presentUserMenu()" [title]="currentUser?.name || 'Usuário'">
        <ion-icon slot="icon-only" name="person-circle"></ion-icon>
      </ion-button>
      <ion-button (click)="onSearch()" title="Buscar">
        <ion-icon slot="icon-only" name="search"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-buttons slot="primary">
      <ion-button (click)="presentOptionsMenu()" title="Opções">
        <ion-icon
          slot="icon-only"
          ios="ellipsis-horizontal"
          md="ellipsis-vertical"
        ></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>
      <img src="assets/img/logos/logo_service_top_branca.svg" alt="Fleet Tracker">
    </ion-title>
  </ion-toolbar>
