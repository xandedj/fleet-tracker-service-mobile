<div class="form-container">
  <div class="title">{{ title }}</div>
  <div class="sub-title">{{ subTitle }}</div>
  <form>
    <!-- Seu código atual melhorado -->
    <ion-item class="item-inner">
      <ion-label position="floating">
        <ion-icon name="mail"></ion-icon>
        Email
      </ion-label>
      <ion-input type="email" required></ion-input>
    </ion-item>

    <ion-item class="item-inner">
      <ion-label position="floating">
        <ion-icon name="lock-closed"></ion-icon>
        Senha
      </ion-label>
      <ion-input type="password" required>
      <ion-input-password-toggle slot="end"></ion-input-password-toggle>
      </ion-input>
    </ion-item>

    <div class="options-container">
      <div class="remember-me-container">
        <ion-toggle [(ngModel)]="rememberMe" name="rememberMe"></ion-toggle>
        <span class="remember-label">Lembre-me</span>
      </div>
      <div class="forgot-password">
        <a class="forgot-link" href="#">Esqueceu a senha?</a>
      </div>
    </div>
    <ion-button expand="block" type="submit">Entrar</ion-button>
  </form>
  
  <div class="footer">
    <p class="copyright">© {{ currentYear }} Fleet Tracker. Todos os direitos reservados.</p>
    <p class="company">Desenvolvido por {{ companyName }}</p>
  </div>
</div>
